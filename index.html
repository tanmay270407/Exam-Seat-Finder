    <script>
      // Gracefully handle dev-server WebSocket closures in proxied/sandboxed environments
      window.addEventListener('unhandledrejection', function (e) {
        var msg = e && e.reason && (e.reason.message || String(e.reason));
        if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1)) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = e && (e.message || (e.error && e.error.message));
        if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1)) {
          e.preventDefault();
        }
      });
    </script>
