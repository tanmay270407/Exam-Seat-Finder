    <script>
      // Gracefully neutralize dev-server HMR WebSocket connections in Cloud Run preview proxy
      (function () {
        var origError = console.error;
        console.error = function () {
          var msg = arguments && arguments[0];
          if (typeof msg === 'string' && (msg.indexOf('[vite] failed to connect to websocket') !== -1 || msg.indexOf('WebSocket closed without opened') !== -1)) {
            return;
          }
          origError.apply(console, arguments);
        };

        var NativeWS = window.WebSocket;
        if (NativeWS) {
          window.WebSocket = function (url, protocols) {
            if (typeof url === 'string' && (url.indexOf('/@vite/client') !== -1 || url.indexOf('vite') !== -1)) {
              return {
                readyState: 3,
                bufferedAmount: 0,
                extensions: '',
                protocol: '',
                binaryType: 'blob',
                addEventListener: function () {},
                removeEventListener: function () {},
                dispatchEvent: function () { return false; },
                send: function () {},
                close: function () {}
              };
            }
            return new NativeWS(url, protocols);
          };
          window.WebSocket.prototype = NativeWS.prototype;
        }
      })();

      window.addEventListener('unhandledrejection', function (e) {
        var msg = e && (e.reason ? (e.reason.message || String(e.reason)) : String(e));
        if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1 || msg.indexOf('vite') !== -1)) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = e && (e.message || (e.error && e.error.message) || String(e));
        if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1 || msg.indexOf('vite') !== -1)) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      }, true);
    </script>
